server:
  port: 9091

grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health

demo:
  # Artificial per-item pause in the streaming RPCs (ListProducts, UploadOrders,
  # StreamOrderStatus) so the streaming behavior is visible in the logs. Set to 0 to disable.
  stream-delay-millis: 300
