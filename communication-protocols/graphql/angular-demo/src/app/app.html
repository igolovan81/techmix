<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
      <circle cx="11" cy="4" r="2.4" fill="currentColor" />
      <circle cx="4" cy="17" r="2.4" fill="currentColor" />
      <circle cx="18" cy="17" r="2.4" fill="currentColor" />
      <path d="M11 6.4 L4 14.6 M11 6.4 L18 14.6 M6 17 H16" stroke="currentColor" stroke-width="1.4" />
    </svg>
    <span class="brand-name">GraphQL Angular Demo</span>
  </a>
  @if (authService.currentUser(); as user) {
    <nav class="nav-links" data-testid="nav-links">
      <a mat-button routerLink="/catalog" routerLinkActive="active-link">Catalog</a>
      <a mat-button routerLink="/categories" routerLinkActive="active-link">Categories</a>
      <a mat-button routerLink="/live" routerLinkActive="active-link">Live Reviews</a>
      <a mat-button routerLink="/orders" routerLinkActive="active-link">Orders</a>
    </nav>
    <span class="spacer"></span>
    <span class="current-user" data-testid="current-user">
      <span class="user-name">{{ user.displayName }}</span>
      <span class="user-role">{{ user.role }}</span>
    </span>
    <button mat-icon-button (click)="logout()" data-testid="logout-button" aria-label="Log out" matTooltip="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>
<main class="app-main">
  <router-outlet />
</main>
