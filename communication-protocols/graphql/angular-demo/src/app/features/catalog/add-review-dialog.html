<h2 mat-dialog-title>Add a review</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-form">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Rating (1-5)</mat-label>
      <input matInput type="number" min="1" max="5" formControlName="rating" data-testid="rating-input" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Comment</mat-label>
      <textarea matInput rows="3" formControlName="comment" data-testid="comment-input"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" data-testid="cancel-button">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid" data-testid="submit-button">
      Submit
    </button>
  </mat-dialog-actions>
</form>
