spring:
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql
  datasource:
    url: jdbc:h2:mem:graphqldemo-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  seed:
    enabled: true
    user-count: 10
    category-count: 10
    product-count: 50
    min-reviews-per-product: 1
    max-reviews-per-product: 3
    order-count: 20
