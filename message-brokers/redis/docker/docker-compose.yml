name: redis-cluster

services:
  redis1:
    image: redis:7.4
    container_name: redis1
    ports:
      - "6379:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis2:
    image: redis:7.4
    container_name: redis2
    ports:
      - "6380:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6380
      --cluster-announce-bus-port 16380
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis3:
    image: redis:7.4
    container_name: redis3
    ports:
      - "6381:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6381
      --cluster-announce-bus-port 16381
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis4:
    image: redis:7.4
    container_name: redis4
    ports:
      - "6382:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6382
      --cluster-announce-bus-port 16382
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis5:
    image: redis:7.4
    container_name: redis5
    ports:
      - "6383:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6383
      --cluster-announce-bus-port 16383
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis6:
    image: redis:7.4
    container_name: redis6
    ports:
      - "6384:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6384
      --cluster-announce-bus-port 16384
      --appendonly yes
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cluster-init:
    image: redis:7.4
    container_name: cluster-init
    depends_on:
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy
      redis4:
        condition: service_healthy
      redis5:
        condition: service_healthy
      redis6:
        condition: service_healthy
    command: >
      redis-cli --cluster create
        redis1:6379 redis2:6379 redis3:6379
        redis4:6379 redis5:6379 redis6:6379
        --cluster-replicas 1 --cluster-yes
    networks:
      - redis_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - cluster-init
    networks:
      - redis_network

networks:
  redis_network:
    driver: bridge
