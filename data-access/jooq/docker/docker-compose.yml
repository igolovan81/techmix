services:
  postgres:
    image: postgres:16-alpine
    container_name: jooq-postgres
    environment:
      POSTGRES_DB: jooqdemo
      POSTGRES_USER: jooq
      POSTGRES_PASSWORD: jooq
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jooq -d jooqdemo"]
      interval: 5s
      timeout: 5s
      retries: 10
