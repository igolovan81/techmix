services:
  postgres:
    image: postgres:16-alpine
    container_name: hibernate-postgres
    environment:
      POSTGRES_DB: hibernatedemo
      POSTGRES_USER: hibernate
      POSTGRES_PASSWORD: hibernate
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hibernate -d hibernatedemo"]
      interval: 5s
      timeout: 5s
      retries: 10
